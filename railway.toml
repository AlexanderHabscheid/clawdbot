[deploy]
# Explicitly bridge Railway's PORT and bind to 0.0.0.0 so the reverse proxy can reach us.
# This overrides the Dockerfile CMD (ENTRYPOINT still runs first).
startCommand = "OPENCLAW_GATEWAY_PORT=$PORT OPENCLAW_SKIP_CHANNELS=1 node openclaw.mjs gateway --allow-unconfigured --bind lan"
# Healthcheck temporarily disabled to diagnose startup — re-enable once confirmed working.
# healthcheckPath = "/health"
# healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
