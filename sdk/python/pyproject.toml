[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "centris-sdk"
version = "1.1.0"
description = "Centris SDK for building connectors and integrations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Centris AI", email = "developers@centris.ai" },
]
keywords = [
    "centris",
    "sdk",
    "connector",
    "mcp",
    "ai",
    "automation",
    "agent",
    "langchain",
    "crewai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
# Server/Gateway features
server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]
# Browser automation
browser = [
    "playwright>=1.40.0",
]
# Desktop automation
desktop = [
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
]
# Enhanced CLI experience
cli = [
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]
# All features
all = [
    "centris-sdk[server,browser,desktop,cli]",
]
# Development
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
centris = "centris_sdk.cli:main"

[project.entry-points."centris.connectors"]
# Entry point group for connector discovery

[project.urls]
Homepage = "https://centris.ai"
Documentation = "https://docs.centris.ai/sdk"
Repository = "https://github.com/centris-ai/centris-ai"
Changelog = "https://github.com/centris-ai/centris-ai/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["centris_sdk"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Support both centralized and colocated tests (Clawdbot pattern)
testpaths = ["tests", "centris_sdk"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage thresholds - fail if coverage drops below 70%
addopts = "--cov=centris_sdk --cov-report=term-missing --cov-fail-under=70 -v"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "live: marks tests that require live services",
]
